name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-glew
            zip

      - name: Build
        run: mingw32-make

      - name: Package
        run: bash package_windows.sh ${{ github.ref_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libglew-dev

      - name: Build
        run: make

      - name: Package
        run: bash package_linux.sh ${{ github.ref_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  # ── Update README download links ───────────────────────────────────────────
  update-readme:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update download links
        run: |
          TAG="${{ github.ref_name }}"
          sed -i "s|/releases/download/v[^/]*/verse-windows-x64-v[^)]*\.zip|/releases/download/${TAG}/verse-windows-x64-${TAG}.zip|g" README.md
          sed -i "s|/releases/download/v[^/]*/verse-linux-x64-v[^)]*\.tar\.gz|/releases/download/${TAG}/verse-linux-x64-${TAG}.tar.gz|g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update download links to ${{ github.ref_name }}"
          git push origin main
